name: Build and publish Doxygen site to gh-pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # don't attempt to fetch submodules (some submodule URLs are not configured)
          submodules: false
          # full history can help some tools; set to 0 to fetch all history
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz default-jre plantuml

      - name: Build Doxygen documentation
        run: |
          # Ensure we run from the repository root where the Doxyfile lives
          doxygen Doxyfile

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/doxygen/html
          publish_branch: gh-pages
